<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Tracking — MindSpace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="mood-tracking.css" />
</head>
<body>
  <!-- SVG Icon Sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path>
    </symbol>
    <symbol id="i-mood" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M8 14c1 1.5 2.5 2.2 4 2.2s3-.7 4-2.2M9 9.5h.01M15 9.5h.01"></path>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="4" y="5" width="16" height="15" rx="3"></rect>
      <path d="M8 3v4M16 3v4M4 10h16"></path>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 20c1-4 4-6 8-6s7 2 8 6"></path>
    </symbol>
    <symbol id="i-article" viewBox="0 0 24 24">
      <path d="M6 4h9l3 3v13H6z"></path>
      <path d="M9 11h6M9 15h6"></path>
    </symbol>
    <symbol id="i-flask" viewBox="0 0 24 24">
      <path d="M9 4h6v5l4 9a2 2 0 0 1-2 3H7a2 2 0 0 1-2-3l4-9z"></path>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M10 4H6v16h4M14 8l4 4-4 4M18 12H9"></path>
    </symbol>
  </svg>

  <div class="app-shell">
    <!-- Decorative Floating Stars -->
    <div class="stars-layer" aria-hidden="true">
      <img src="picture/white-stars.png" alt="" class="star star-1" />
      <img src="picture/yellow-stars.png" alt="" class="star star-2" />
      <img src="picture/white-stars.png" alt="" class="star star-3" />
    </div>

    <!-- Glass Sidebar -->
    <aside class="sidebar">
      <a href="dashboard.html" class="brand-logo" aria-label="MindSpace Dashboard">
        <img src="picture/logo.png" alt="MindSpace Logo" />
      </a>

      <nav class="nav" aria-label="Menu Utama">
        <a href="dashboard.html" class="nav-item">
          <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-home" /></svg>
          <span>Dashboard</span>
        </a>
        <a href="mood-tracking.html" class="nav-item active">
          <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-mood" /></svg>
          <span>Mood Tracking</span>
        </a>
        <a href="reservasi.html" class="nav-item">
          <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-calendar" /></svg>
          <span>Reservasi</span>
        </a>
        <a href="#profile" class="nav-item">
          <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-user" /></svg>
          <span>Profile</span>
        </a>
        <a href="index.html#explore-discover" class="nav-item">
          <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-article" /></svg>
          <span>Artikel</span>
        </a>
        <a href="#layanan-tes" class="nav-item">
          <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-flask" /></svg>
          <span>Layanan Tes</span>
        </a>
      </nav>

      <a href="index.html" id="btn-logout" class="nav-item logout">
        <svg class="icon" width="21" height="21" aria-hidden="true"><use href="#i-logout" /></svg>
        <span>Logout</span>
      </a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="page-header">
        <span class="chip">Mood Tracking</span>
        <h1 class="page-title">Bagaimana perasaanmu hari ini?</h1>
      </header>

      <!-- Pilihan Mood Interaktif (Pure CSS Radio Buttons) -->
      <section class="mood-grid" role="radiogroup" aria-label="Pilih suasana hatimu">
        <div class="mood-option">
          <input type="radio" name="daily_mood" id="mood-senang" value="Senang" class="mood-input" />
          <label for="mood-senang" class="glass-card mood-card">
            <span class="mood-dot" aria-hidden="true"></span>
            <span>Senang</span>
          </label>
        </div>

        <div class="mood-option">
          <input type="radio" name="daily_mood" id="mood-tenang" value="Tenang" class="mood-input" checked />
          <label for="mood-tenang" class="glass-card mood-card">
            <span class="mood-dot" aria-hidden="true"></span>
            <span>Tenang</span>
          </label>
        </div>

        <div class="mood-option">
          <input type="radio" name="daily_mood" id="mood-biasa" value="Biasa saja" class="mood-input" />
          <label for="mood-biasa" class="glass-card mood-card">
            <span class="mood-dot" aria-hidden="true"></span>
            <span>Biasa saja</span>
          </label>
        </div>

        <div class="mood-option">
          <input type="radio" name="daily_mood" id="mood-sedih" value="Sedih" class="mood-input" />
          <label for="mood-sedih" class="glass-card mood-card">
            <span class="mood-dot" aria-hidden="true"></span>
            <span>Sedih</span>
          </label>
        </div>

        <div class="mood-option">
          <input type="radio" name="daily_mood" id="mood-cemas" value="Cemas" class="mood-input" />
          <label for="mood-cemas" class="glass-card mood-card">
            <span class="mood-dot" aria-hidden="true"></span>
            <span>Cemas</span>
          </label>
        </div>
      </section>

      <!-- Catatan Singkat -->
      <section class="glass-card note-section" aria-label="Catatan singkat">
        <label for="mood-note" class="label-caps">Catatan singkat</label>
        <textarea
          id="mood-note"
          name="mood_note"
          class="note-textarea"
          rows="3"
          placeholder="Ceritakan apa yang kamu rasakan…"
        ></textarea>

        <div class="note-actions">
          <a href="#mood-saved" id="btn-save-mood" class="btn-primary">Simpan</a>
          <span id="mood-saved" class="saved-badge" role="status">
            ✓ Mood hari ini tersimpan
          </span>
        </div>
      </section>

      <!-- Grafik 7 Hari Terakhir -->
      <section class="glass-card chart-section" aria-label="Grafik mood 7 hari terakhir">
        <div class="chart-header">
          <p class="label-caps">Mood 7 hari terakhir</p>
          <span class="chart-hint">Arahkan kursor ke batang untuk detail</span>
        </div>

        <div class="chart">
          <div class="chart-col">
            <span class="bar-tooltip">Biasa</span>
            <div class="bar-track"><div class="bar" style="--h: 90px"></div></div>
            <span class="label-caps">Sen</span>
          </div>
          <div class="chart-col">
            <span class="bar-tooltip">Tenang</span>
            <div class="bar-track"><div class="bar" style="--h: 130px"></div></div>
            <span class="label-caps">Sel</span>
          </div>
          <div class="chart-col">
            <span class="bar-tooltip">Cemas</span>
            <div class="bar-track"><div class="bar" style="--h: 70px"></div></div>
            <span class="label-caps">Rab</span>
          </div>
          <div class="chart-col">
            <span class="bar-tooltip">Senang</span>
            <div class="bar-track"><div class="bar" style="--h: 150px"></div></div>
            <span class="label-caps">Kam</span>
          </div>
          <div class="chart-col">
            <span class="bar-tooltip">Tenang</span>
            <div class="bar-track"><div class="bar" style="--h: 110px"></div></div>
            <span class="label-caps">Jum</span>
          </div>
          <div class="chart-col">
            <span class="bar-tooltip">Senang</span>
            <div class="bar-track"><div class="bar" style="--h: 170px"></div></div>
            <span class="label-caps">Sab</span>
          </div>
          <div class="chart-col">
            <span class="bar-tooltip">Tenang</span>
            <div class="bar-track"><div class="bar active-bar" style="--h: 120px"></div></div>
            <span class="label-caps">Min</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- <script src="mood-tracking.js"></script> -->
</body>
</html>
