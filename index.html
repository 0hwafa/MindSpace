<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindSpace — A Little Space to Understand Yourself</title>

  <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans (Sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Decorative Floating Stars (Pure CSS Animation) -->
    <div class="stars-layer" aria-hidden="true">
      <img
        src="picture/white-stars.png"
        alt=""
        class="star star-1"
      />
      <img
        src="picture/yellow-stars.png"
        alt=""
        class="star star-2"
      />
      <img
        src="picture/yellow-stars.png"
        alt=""
        class="star star-3"
      />
      <img
        src="picture/white-stars.png"
        alt=""
        class="star star-4"
      />
    </div>

    <!-- Header & Navigation -->
    <header class="site-header">
      <div class="header-top">
        <a href="#" class="brand-logo" aria-label="MindSpace Home">
          <img src="picture/logo.png" alt="MindSpace Logo" />
        </a>

        <div class="auth-actions">
          <a href="#login" id="btn-login" class="btn-login">Log In</a>
          <a href="#get-started" id="btn-get-started" class="btn btn-primary btn-sm">
            Get Started
          </a>
        </div>
      </div>

      <nav class="main-nav" aria-label="Navigasi Utama">
        <ul class="nav-list">
          <li><a href="#how-it-works" class="nav-link">How It Works</a></li>
          <li><a href="#features" class="nav-link">Features</a></li>
          <li><a href="#articles" class="nav-link">Articles</a></li>
          <li><a href="#about" class="nav-link">About</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">
          Your mind deserves<br />
          a place that feels safe
        </h1>

        <p class="hero-subtitle">
          A little space to understand yourself.
        </p>

        <p class="hero-description">
          Tidak semua hari terasa sama. Kenali perasaanmu, pahami dirimu,
          dan temukan ruang aman untuk bercerita bersama MindSpace.
        </p>

        <div class="hero-cta">
          <a href="#start" id="btn-start-here" class="btn btn-primary btn-lg">
            Start Here
          </a>
          <a href="#explore" id="btn-explore" class="btn btn-secondary btn-lg">
            Explore
          </a>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
